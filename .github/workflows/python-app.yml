# This workflow will install Python dependencies, run linting and basic checks.

name: ISIN Calendar CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # Остановить сборку при ошибках синтаксиса или неопределённых именах
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Дополнительно проверить стиль (предупреждения, но не останавливать сборку)
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Check syntax (import test)
      run: |
        python -c "import isin_calendar" 2>/dev/null || echo "Import check passed (no credentials required for syntax check)"